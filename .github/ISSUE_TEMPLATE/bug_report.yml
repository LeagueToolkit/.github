name: Bug report
description: Something is broken, crashes, or produces wrong output.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before filing: please check you're on the [latest release](https://github.com/LeagueToolkit)
        and search the existing issues.

  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `<tool> --version`, or the release tag / commit you built from.
      placeholder: "0.12.3"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 11
        - Windows 10
        - Linux
        - macOS
        - Other
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: >
        The exact command you ran, and what you ran it against. If a specific game file is
        involved, name it (`Aatrox.wad.client` from patch 15.19) - don't attach game assets.
      render: shell
      placeholder: |
        wadtools extract -i Aatrox.wad.client -o out
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: Full output
      description: >
        The complete error, including any backtrace. Re-run with the most verbose logging the
        tool offers (`-L trace`, `RUST_BACKTRACE=1`, and so on) if you can.
      render: shell
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Game version, whether it used to work, screenshots.
    validations:
      required: false
